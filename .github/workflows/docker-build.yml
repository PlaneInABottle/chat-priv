# Docker Build and Push to Private Docker Hub Registry
# This workflow builds the Chatwoot Docker image and pushes it to planeinabottle/simwoot
# Triggers on push to main branch only

name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    # Allows manual trigger from GitHub UI for testing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up QEMU for multi-platform builds (optional but recommended)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 3: Set up Docker Buildx for advanced build features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Login to Docker Hub using GitHub secrets
      # Requires DOCKER_USERNAME and DOCKER_PASSWORD secrets to be configured in repo settings
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5: Extract metadata for Docker tags and labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: planeinabottle/simwoot
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # Step 6: Build and push Docker image to Docker Hub
      # Uses docker/Dockerfile, tags with both 'latest' and commit SHA
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            planeinabottle/simwoot:latest
            planeinabottle/simwoot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
