[project]
name = "kozmopath-voice-agent"
version = "0.1.0"
description = "LiveKit voice AI worker for Chatwoot voice calls"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.12.0",
  "livekit-agents[openai,google,silero,deepgram,cartesia,turn-detector]>=1.5,<2.0",
  "python-dotenv>=1.0.1",
]

[tool.uv]
package = false
# livekit-agents 1.5.17 pins json-repair 0.59.10, which is vulnerable to a
# circular-schema CPU denial of service. Keep this override until upstream
# accepts the fixed 0.60.x release.
override-dependencies = ["json-repair>=0.60.1,<0.61"]
