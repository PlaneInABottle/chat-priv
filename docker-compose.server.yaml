name: kozmopath-server

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  redis:
    # Match the RDB format produced by the existing Redis 8 data before pinning upgrades.
    image: redis:8.8-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  postgres_data:
    external: true
    name: kozmopath-server_postgres_data
  redis_data:
    external: true
    name: kozmopath-server_redis_data
