# Render Blueprint for Chatwoot
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: chatwoot-web
    runtime: docker
    region: frankfurt
    autoDeployTrigger: 'off'
    # Use the memory-optimized Dockerfile for Render
    dockerfilePath: docker/Dockerfile.render
    dockerContext: .
    # Standard instance (4GB RAM) - sufficient with optimized Dockerfile
    plan: standard
    healthCheckPath: /api
    preDeployCommand: bundle exec rails db:prepare
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: SECRET_KEY_BASE
        sync: false # Must be the SAME value for web + worker (do not auto-generate per service)
      - key: DISABLE_ENTERPRISE
        value: "true"
      - key: FRONTEND_URL
        value: https://chatwoot-web-kw3b.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chatwoot-redis
          type: keyvalue
          property: connectionString
      # Instagram Channel Configuration
      - key: INSTAGRAM_APP_ID
        sync: false  # Set this manually in Render dashboard
      - key: INSTAGRAM_APP_SECRET
        sync: false  # Set this manually in Render dashboard
      - key: INSTAGRAM_VERIFY_TOKEN
        sync: false  # Set this manually in Render dashboard (must be same value in both web and worker)
      - key: ENABLE_INSTAGRAM_CHANNEL_HUMAN_AGENT
        value: "false"  # Set to "true" if you need 7-day messaging window (requires Meta approval)
      # Storage configuration for DigitalOcean Spaces
      - key: ACTIVE_STORAGE_SERVICE
        value: s3_compatible
      - key: STORAGE_ACCESS_KEY_ID
        sync: false  # Set this manually in Render dashboard or use sync: false to add as secret
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false  # Set this manually in Render dashboard or use sync: false to add as secret
      - key: STORAGE_BUCKET_NAME
        value: simwoot-files  # Replace with your actual bucket name
      - key: STORAGE_REGION
        value: fra1  # Replace with your region (fra1, nyc3, sgp1, etc)
      - key: STORAGE_ENDPOINT
        value: https://fra1.digitaloceanspaces.com  # Replace with your region endpoint
      # Google OAuth Configuration
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false  # Set this manually in Render dashboard
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false  # Set this manually in Render dashboard
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false  # Set this manually in Render dashboard
      - key: ENABLE_GOOGLE_OAUTH_LOGIN
        value: "true"

  - type: worker
    name: chatwoot-worker
    runtime: docker
    region: frankfurt
    autoDeployTrigger: 'off'
    dockerfilePath: docker/Dockerfile.render
    dockerContext: .
    plan: standard
    dockerCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        sync: false # Must be the SAME value for web + worker (do not auto-generate per service)
      - key: DISABLE_ENTERPRISE
        value: "true"
      - key: FRONTEND_URL
        value: https://chatwoot-web-kw3b.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chatwoot-redis
          type: keyvalue
          property: connectionString
      # Instagram Channel Configuration
      - key: INSTAGRAM_APP_ID
        sync: false  # Set this manually in Render dashboard
      - key: INSTAGRAM_APP_SECRET
        sync: false  # Set this manually in Render dashboard
      - key: INSTAGRAM_VERIFY_TOKEN
        sync: false  # Set this manually in Render dashboard (must be same value in both web and worker)
      - key: ENABLE_INSTAGRAM_CHANNEL_HUMAN_AGENT
        value: "false"  # Set to "true" if you need 7-day messaging window (requires Meta approval)
      # Storage configuration for DigitalOcean Spaces
      - key: ACTIVE_STORAGE_SERVICE
        value: s3_compatible
      - key: STORAGE_ACCESS_KEY_ID
        sync: false  # Set this manually in Render dashboard
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false  # Set this manually in Render dashboard
      - key: STORAGE_BUCKET_NAME
        value: simwoot-files  # Replace with your actual bucket name
      - key: STORAGE_REGION
        value: fra1  # Replace with your region (fra1, nyc3, sgp1, etc)
      - key: STORAGE_ENDPOINT
        value: https://fra1.digitaloceanspaces.com  # Replace with your region endpoint
      # Google OAuth Configuration
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false  # Set this manually in Render dashboard
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false  # Set this manually in Render dashboard
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false  # Set this manually in Render dashboard
      - key: ENABLE_GOOGLE_OAUTH_LOGIN
        value: "true"

  - type: keyvalue
    name: chatwoot-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: chatwoot-db
    region: frankfurt
    plan: basic-256mb
    databaseName: chatwoot
    user: chatwoot
