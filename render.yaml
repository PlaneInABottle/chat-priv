# Render Blueprint for CRM
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: crm-web
    runtime: docker
    region: frankfurt
    autoDeployTrigger: 'off'
    # Use the memory-optimized Dockerfile for Render
    dockerfilePath: docker/Dockerfile.render
    dockerContext: .
    # Standard instance (4GB RAM) - sufficient with optimized Dockerfile
    plan: standard
    healthCheckPath: /api
    preDeployCommand: bundle exec rails db:prepare
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DEFAULT_LOCALE
        value: tr
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: SECRET_KEY_BASE
        sync: false # Must be the SAME value for web + worker (do not auto-generate per service)
      - key: DISABLE_ENTERPRISE
        value: "true"
      - key: FRONTEND_URL
        value: https://app.kozmopath.com
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: crm-redis
          type: keyvalue
          property: connectionString
      # Inbound email configuration for conversation continuity (SendGrid)
      - key: RAILS_INBOUND_EMAIL_SERVICE
        value: sendgrid
      - key: MAILER_INBOUND_EMAIL_DOMAIN
        value: raven.kozmopath.com
      - key: RAILS_INBOUND_EMAIL_PASSWORD
        sync: false  # Secret - set manually in Render dashboard
      # Storage configuration for DigitalOcean Spaces
      - key: ACTIVE_STORAGE_SERVICE
        value: s3_compatible
      - key: STORAGE_ACCESS_KEY_ID
        sync: false  # Set this manually in Render dashboard
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false  # Set this manually in Render dashboard
      - key: STORAGE_BUCKET_NAME
        value: kozmopath-files  # Replace with your actual bucket name
      - key: STORAGE_REGION
        value: fra1  # Replace with your region (fra1, nyc3, sgp1, etc)
      - key: STORAGE_ENDPOINT
        value: https://fra1.digitaloceanspaces.com  # Replace with your region endpoint

  - type: worker
    name: crm-worker
    runtime: docker
    region: frankfurt
    autoDeployTrigger: 'off'
    dockerfilePath: docker/Dockerfile.render
    dockerContext: .
    plan: standard
    dockerCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DEFAULT_LOCALE
        value: tr
      - key: SECRET_KEY_BASE
        sync: false # Must be the SAME value for web + worker (do not auto-generate per service)
      - key: DISABLE_ENTERPRISE
        value: "true"
      - key: FRONTEND_URL
        value: https://app.kozmopath.com
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: crm-redis
          type: keyvalue
          property: connectionString
      # Inbound email configuration for conversation continuity (SendGrid)
      - key: RAILS_INBOUND_EMAIL_SERVICE
        value: sendgrid
      - key: MAILER_INBOUND_EMAIL_DOMAIN
        value: raven.kozmopath.com
      - key: RAILS_INBOUND_EMAIL_PASSWORD
        sync: false  # Secret - set manually in Render dashboard
      # Storage configuration for DigitalOcean Spaces
      - key: ACTIVE_STORAGE_SERVICE
        value: s3_compatible
      - key: STORAGE_ACCESS_KEY_ID
        sync: false  # Set this manually in Render dashboard
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false  # Set this manually in Render dashboard
      - key: STORAGE_BUCKET_NAME
        value: kozmopath-files  # Replace with your actual bucket name
      - key: STORAGE_REGION
        value: fra1  # Replace with your region (fra1, nyc3, sgp1, etc)
      - key: STORAGE_ENDPOINT
        value: https://fra1.digitaloceanspaces.com  # Replace with your region endpoint

  - type: keyvalue
    name: crm-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: crm-db
    region: frankfurt
    plan: basic-256mb
    databaseName: crm
    user: crm-admin
