# Render Blueprint for CRM
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: crm-web
    runtime: docker
    region: frankfurt
    autoDeployTrigger: 'off'
    # Use the memory-optimized Dockerfile for Render
    dockerfilePath: docker/Dockerfile.render
    dockerContext: .
    # Standard runtime instance (2GB RAM, 1 CPU); build compute is configured separately
    plan: standard
    healthCheckPath: /api
    preDeployCommand: bundle exec rails db:prepare
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DEFAULT_LOCALE
        value: tr
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: SECRET_KEY_BASE
        sync: false # Must be the SAME value for web + worker (do not auto-generate per service)
      - key: DISABLE_ENTERPRISE
        value: "true"
      - key: FRONTEND_URL
        value: https://app.kozmopath.com
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: crm-redis
          type: keyvalue
          property: connectionString
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: VOICE_AGENT_NAME
        value: kozmopath-voice-agent
      - key: VOICE_AGENT_INTERNAL_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      # Storage configuration for DigitalOcean Spaces
      - key: ACTIVE_STORAGE_SERVICE
        value: s3_compatible
      - key: STORAGE_ACCESS_KEY_ID
        sync: false  # Set this manually in Render dashboard
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false  # Set this manually in Render dashboard
      - key: STORAGE_BUCKET_NAME
        value: kozmopath-files  # Replace with your actual bucket name
      - key: STORAGE_REGION
        value: fra1  # Replace with your region (fra1, nyc3, sgp1, etc)
      - key: STORAGE_ENDPOINT
        value: https://fra1.digitaloceanspaces.com  # Replace with your region endpoint

  - type: worker
    name: crm-worker
    runtime: docker
    region: frankfurt
    autoDeployTrigger: 'off'
    dockerfilePath: docker/Dockerfile.render
    dockerContext: .
    plan: standard
    dockerCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DEFAULT_LOCALE
        value: tr
      - key: SECRET_KEY_BASE
        sync: false # Must be the SAME value for web + worker (do not auto-generate per service)
      - key: DISABLE_ENTERPRISE
        value: "true"
      - key: FRONTEND_URL
        value: https://app.kozmopath.com
      - key: SIDEKIQ_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: crm-redis
          type: keyvalue
          property: connectionString
      - key: LIVEKIT_URL
        fromService:
          name: crm-web
          type: web
          envVarKey: LIVEKIT_URL
      - key: LIVEKIT_API_KEY
        fromService:
          name: crm-web
          type: web
          envVarKey: LIVEKIT_API_KEY
      - key: LIVEKIT_API_SECRET
        fromService:
          name: crm-web
          type: web
          envVarKey: LIVEKIT_API_SECRET
      # Storage configuration for DigitalOcean Spaces
      - key: ACTIVE_STORAGE_SERVICE
        value: s3_compatible
      - key: STORAGE_ACCESS_KEY_ID
        sync: false  # Set this manually in Render dashboard
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false  # Set this manually in Render dashboard
      - key: STORAGE_BUCKET_NAME
        value: kozmopath-files  # Replace with your actual bucket name
      - key: STORAGE_REGION
        value: fra1  # Replace with your region (fra1, nyc3, sgp1, etc)
      - key: STORAGE_ENDPOINT
        value: https://fra1.digitaloceanspaces.com  # Replace with your region endpoint

  - type: worker
    name: crm-voice-agent
    runtime: docker
    region: frankfurt
    autoDeployTrigger: 'off'
    dockerfilePath: services/voice_agent/Dockerfile
    dockerContext: services/voice_agent
    # Starter is sufficient for the initial single-call voice demo; upgrade if metrics show pressure
    plan: starter
    maxShutdownDelaySeconds: 300
    envVars:
      - key: LIVEKIT_URL
        fromService:
          name: crm-web
          type: web
          envVarKey: LIVEKIT_URL
      - key: LIVEKIT_API_KEY
        fromService:
          name: crm-web
          type: web
          envVarKey: LIVEKIT_API_KEY
      - key: LIVEKIT_API_SECRET
        fromService:
          name: crm-web
          type: web
          envVarKey: LIVEKIT_API_SECRET
      - key: CHATWOOT_INTERNAL_API_URL
        value: https://app.kozmopath.com
      - key: VOICE_AGENT_INTERNAL_TOKEN
        fromService:
          name: crm-web
          type: web
          envVarKey: VOICE_AGENT_INTERNAL_TOKEN
      - key: VOICE_AGENT_NAME
        value: kozmopath-voice-agent
      - key: VOICE_AGENT_MAX_CONCURRENT_JOBS
        value: "2"
      - key: VOICE_AGENT_DRAIN_TIMEOUT_SECONDS
        value: "300"
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: keyvalue
    name: crm-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: crm-db
    region: frankfurt
    plan: basic-256mb
    databaseName: chatwoot
    user: chatwoot
