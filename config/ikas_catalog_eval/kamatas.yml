# Local/dev evaluation pack for the current Kamataş-like Ikas snapshot.
# Keep product-specific expectations here instead of hardcoding them in search logic.
- id: beyaz_perde
  query: "beyaz perde"
  expect:
    result_type:
      - show_candidates
      - show_compatible_candidates
    min_results: 1
    top_results_include:
