        title: "Kullanım Koşulları"
        intro: "Bu koşullar, Kozmopath web sitesini ve hizmetini kullanımınızı düzenler. Hesap oluşturarak veya hizmeti kullanarak bu koşulları kabul etmiş olursunuz."
        sections:
          acceptance:
            title: "Koşulların kabulü"
            body: "Hesap oluşturarak, web sitesine erişerek veya hizmeti kullanarak bu koşulları kabul etmiş olursunuz. Kabul etmiyorsanız hizmeti kullanmamalısınız."
          eligibility:
            title: "Uygunluk"
            body: "Hizmeti kullanmak için ülkenizde yasal yaşa ulaşmış olmanız veya temsil etmeye yetkili olduğunuz bir işletme adına kullanmanız gerekir."
          account:
            title: "Hesabınız"
            body: "Giriş bilgilerinizin gizliliğini korumak ve hesabınız altında gerçekleşen faaliyetler konusunda sorumluluk size aittir. Yetkisiz kullanım fark ederseniz bize bildirin."
          service_description:
            title: "Hizmet"
            body: "Kozmopath, mağaza kataloğunuzu desteklenen kanallardaki müşteri konuşmalarına bağlar, katalog bağlamlı yanıtlar sunar ve gerektiğinde konuşmaları ekibinize devreder."
          connected_accounts:
            title: "Bağlı hesaplar ve entegrasyonlar"
            body: "Hizmet, verdiğiniz izinler kapsamında mağaza ve kanal hesaplarınıza bağlanabilir. Hizmet üzerinden paylaşılan veriler için müşterilerinizden gereken izinleri almak sizin sorumluluğunuzdadır."
          customer_content:
            title: "İçeriğiniz"
            body: "Sağladığınız içeriğin mülkiyeti size aittir. Hizmeti işletmek için gereken sınırlı hakları bize tanırsınız. İçeriğinizin yasallığından ve ilgili kurallara uyumundan siz sorumlusunuz."
          ai_limitations:
            title: "Yapay zekâ yanıtları ve sınırları"
            body: "Yapay zekâ tarafından üretilen yanıtlar katalog verilerine dayanır ve eksik ya da hatalı olabilir. Profesyonel değerlendirmenin yerine geçmez. Desteklenen yerlerde insan incelemesi ve devir imkânı sunulur. İnsan değerlendirmesi gerektiren kararlarda yalnızca yapay zekâ yanıtlarına güvenmeyin."
          quotas_and_fees:
            title: "Kotalar ve ücretler"
            body: "Hizmet şu anda web sitesinde genel hatlarıyla açıklanan ücretsiz aylık kotalar sunar. Gelecekte bildirimle birlikte ücretli planlar veya ücretler getirilebilir. Burada açıklananlar dışında hizmet için ücret talep etmeyiz."
          acceptable_use:
            title: "Kabul edilebilir kullanım"
            body: "Hizmeti spam, kimlik avı veya yanıltıcı mesaj göndermek, yasa dışı içerik dağıtmak, hizmete müdahale etmek veya başkalarının haklarını ya da ilgili mevzuatı ihlal etmek için kullanamazsınız."
          ip_feedback:
            title: "Fikri mülkiyet ve geri bildirim"
            body: "Kozmopath ve lisans verenleri, hizmetteki fikri mülkiyet haklarının sahibidir. Bize geri bildirim veya öneri gönderdiğinizde, bunları hizmeti geliştirmek için kullanma hakkı tanırsınız."
          privacy:
            title: "Gizlilik"
            body: "Gizlilik Politikamız, uygulandığı ölçüde KVKK dahil kişisel verilerin nasıl işlendiğini açıklar ve bu koşulların parçasıdır."
          availability:
            title: "Kullanılabilirlik"
            body: "Hizmeti erişilebilir tutmayı hedefleriz ancak kesintisiz çalışmayı garanti etmeyiz. Hizmet değişebilir, güncellenebilir veya bakım nedeniyle geçici olarak erişilemez olabilir."
          suspension_termination:
            title: "Askıya alma ve fesih"
            body: "Bu koşulların ihlali veya yasal zorunluluk hâlinde hizmete erişimi askıya alabilir veya sonlandırabiliriz. Fesihten önce hizmet üzerinden erişebildiğiniz verileri dışa aktarabilirsiniz. Silinen veriler geri getirilemeyebilir."
          disclaimers:
            title: "Sorumluluk reddi"
            body: "Hizmet, ilgili mevzuatın izin verdiği ölçüde olduğu gibi sunulur. Hizmetin hatasız olacağını veya yapay zekâ yanıtlarının doğru olacağını garanti etmeyiz."
          liability:
            title: "Sorumluluk"
            body: "Zorunlu hukuk kurallarının izin verdiği ölçüde sorumluluğumuz, hizmet için ödediğiniz tutarla veya hizmet ücretsizse makul bir tutarla sınırlıdır. Bu koşullar, kanunen sınırlanamayan sorumlulukları sınırlamaz."
          governing_law:
            title: "Uygulanacak hukuk"
            body: "Bu koşullar, geçerli Türkiye hukukuna tabidir. Uyuşmazlıklar, ilgili mevzuata göre yetkili mahkemelerde çözümlenir."
          changes:
            title: "Koşul değişiklikleri"
            body: "Bu koşulları zaman zaman güncelleyebiliriz. Değişikliklerin yayımlanmasından sonra hizmeti kullanmaya devam etmeniz, güncel koşulları kabul ettiğiniz anlamına gelir."
