            title: "Politikanın kapsamı"
            body: "Bu politika, Kozmopath web sitesini ve ikas üzerinden bağlanan mağazalara sunduğumuz hizmetleri kapsar. Mağazanın ayrı bir veri sorumlusu olarak hareket ettiği durumlarda mağazanın kendi politikaları da verilerinize uygulanabilir."
          data_we_process:
            title: "İşlediğimiz veriler"
            body: "Hizmetin kullanım şekline bağlı olarak şunları işleyebiliriz:"
            items:
              - "Ad, iş e-posta adresi ve hesap ayarları gibi hesap ve profil bilgileri."
              - "Hizmet üzerinden iletilen mesajlar dahil müşteri, kişi ve konuşma içerikleri."
              - "Ürün bilgileri ile mağaza ve kanal bağlantıları dahil katalog ve entegrasyon verileri."
              - "Sorular, araç sonuçları ve üretilen yanıtlar dahil yapay zekâ ve araç etkileşim verileri."
              - "Ses özelliği etkinleştirildiğinde ve kullanıldığında ses kayıtları ve konuşma dökümleri."
              - "IP adresi, tarayıcı bilgisi ve kullanım kayıtları gibi cihaz, günlük, çerez ve yerel depolama verileri."
          sources:
            title: "Verilerin kaynakları"
            body: "Verileri doğrudan sizden, mağaza ve kanal entegrasyonlarınızdan, hizmet üzerinden yürütülen konuşmalardan ve günlük ile çerezler aracılığıyla otomatik olarak toplarız."
          purposes:
            title: "Verileri neden işliyoruz"
            body: "Kişisel verileri şu amaçlarla kullanırız:"
            items:
              - "Katalog bağlamlı yanıtlar ve insan devri dahil hizmetin sunulması."
              - "Destek sağlanması ve taleplerin yanıtlanması."
              - "Ürünün ve güvenilirliğinin geliştirilmesi."
              - "Hizmetin güvenliğinin korunması ve kötüye kullanımın önlenmesi."
              - "Yasal yükümlülüklerin yerine getirilmesi."
          legal_bases:
            title: "Hukuki dayanaklar"
            body: "Kişisel verileri, geçerli olduğu ölçüde şu dayanaklarla işleriz:"
            items:
              - "Hizmetin sunulması kapsamında sizinle kurulan sözleşmenin ifası."
              - "Yasal yükümlülüklerin yerine getirilmesi."
              - "Geçerli olduğu durumlarda haklarınızla dengelenen meşru menfaatler."
              - "İlgili mevzuatın gerektirdiği durumlarda açık rıza."
          sharing:
            title: "Verileri kimlerle paylaşıyoruz"
            body: "Kişisel verileri yalnızca sınırlı durumlarda paylaşırız:"
            items:
              - "Hizmetin işleyişini destekleyen ve talimatlarımız doğrultusunda hareket eden hizmet sağlayıcılarla."
              - "Kanun, yasal süreç veya yetkili makam gerektirdiğinde."
              - "Uygun güvencelerle, bir iş devri veya yeniden yapılanma kapsamında."
          international_processing:
            title: "Uluslararası işleme"
            body: "Veriler, bulunduğunuz ülkenin dışında da işlenebilir. İlgili mevzuat bu tür aktarımlar için güvence gerektirdiğinde uygun önlemleri uygularız."
          retention:
            title: "Saklama süresi"
            body: "Kişisel verileri yalnızca bu politikada açıklanan amaçlar için gereken süre boyunca, hesabınızın süresi veya yasal yükümlülüklerimiz ölçüsünde saklarız. Saklama süreleri her amaca göre değerlendirilir ve önceden sabitlenmez."
          security:
            title: "Güvenlik"
            body: "Kişisel verileri korumak için makul teknik ve idari önlemler uygularız. Hiçbir iletim veya saklama yöntemi tamamen güvenli değildir; bu nedenle mutlak güvenlik garanti edemeyiz."
          your_rights:
            title: "Haklarınız"
            body: "Geçerli mevzuata ve uygulandığı ölçüde KVKK ile GDPR'a göre şu haklara sahip olabilirsiniz:"
            items:
              - "Verilerinize erişim ve kopyasını talep etme."
              - "Eksik veya hatalı verilerin düzeltilmesini talep etme."
              - "Verilerinizin silinmesini talep etme."
              - "İşlemenin kısıtlanmasını talep etme."
              - "Verilerin taşınmasını talep etme."
              - "İşlemeye itiraz etme."
              - "Rızaya dayalı işlemelerde rızayı geri çekme."
          children:
            title: "Çocuklar"
            body: "Hizmet çocuklara yönelik değildir. Bir çocuğun hizmet üzerinden kişisel veri paylaştığını düşünüyorsanız bizimle iletişime geçin; talebinizi değerlendiririz."
